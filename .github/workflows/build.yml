name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Installs Gradle on PATH so the build also works before gradlew has been committed.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.0

      - name: Build
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew build --stacktrace
          else
            gradle build --stacktrace
          fi

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: rkbclient-jar
          path: build/libs/*.jar
          if-no-files-found: error
